<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Yap Code — amber gold / amber red / burnt orange</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#1a1917; --panel:#211f1d; --ink:#e9e3d8; --mut:#928c81; --dim:#6f6a61; --acc:#dd8a6a; --line:#322f2b; --line2:#3c3833; --disp:"Anton",sans-serif; --body:"Archivo",ui-sans-serif,system-ui,sans-serif; }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: var(--body); margin: 0; padding: 44px 28px 110px; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 960px; margin: 0 auto; }
  h1 { font-family: var(--disp); text-transform: uppercase; font-weight: 400; font-size: 32px; letter-spacing: .02em; margin: 0 0 8px; }
  .sub { color: var(--mut); font-size: 14px; margin: 0 0 30px; line-height: 1.5; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
  @media (max-width: 720px){ .row { grid-template-columns: 1fr; } }
  .card { border: 1px solid var(--line2); border-radius: 16px; padding: 20px; background: color-mix(in srgb, var(--panel) 50%, transparent); text-align: center; }
  .name { font-family: var(--disp); text-transform: uppercase; font-weight: 400; font-size: 16px; letter-spacing: .03em; margin: 0 0 14px; }
  .big { background: linear-gradient(90deg, #14130f 50%, #ece6da 50%); border-radius: 12px; height: 150px; display: grid; place-items: center; margin-bottom: 14px; }
  .big svg { width: 96px; height: 96px; }
  .sizes { display:flex; align-items:center; justify-content:center; gap:16px; }
  .t32, .t16 { background: linear-gradient(90deg,#14130f 50%,#ece6da 50%); border-radius:5px; padding:6px; display:inline-flex; }
  .t32 svg { width: 32px; height: 32px; } .t16 svg { width: 16px; height: 16px; }
  .tabrow { display:flex; gap:10px; justify-content:center; margin-top:14px; }
  .tab { display:inline-flex; align-items:center; gap:6px; padding:5px 11px 5px 8px; border-radius:7px 7px 0 0; font-size:11px; }
  .tab svg { width:15px; height:15px; }
  .tab.d { background:#2b2a28; color:#cfc9bf; } .tab.l { background:#ededed; color:#2b2b2b; }
  .hex { color: var(--dim); font-size: 11px; margin-top: 12px; font-family: ui-monospace, monospace; }
  .note { color: var(--dim); font-size: 12px; margin-top: 30px; line-height: 1.6; } .note b { color: var(--mut); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Amber gold · Amber red · Burnt orange</h1>
  <p class="sub">The S3 line wave in the three you asked for, side by side — big over split <span style="color:#bbb">dark&nbsp;|&nbsp;light</span>, at 32 &amp; 16px, and in dark/light tabs.</p>
  <div class="row" id="row"></div>
  <p class="note">Say which one and I'll ship it to <code style="color:var(--mut)">app/icon.svg</code>. Want a stop nudged (lighter start, deeper end, etc.)? Tell me.</p>
</div>
<script>
  const D = "M2 16 C4 16 4 23 6 23 C8 23 8 6 10.5 6 C13 6 13 27 16 27 C19 27 19 8 21.5 8 C24 8 24 22 26 22 C28 22 28 16 30 16";
  let uid = 0;
  function sv(stops, w) {
    const id = "g"+(uid++);
    const s = stops.map(([o,c]) => `<stop offset="${o}" stop-color="${c}"/>`).join("");
    return `<svg viewBox="0 0 32 32"><defs><linearGradient id="${id}" x1="2" y1="16" x2="30" y2="16" gradientUnits="userSpaceOnUse">${s}</linearGradient></defs><path d="${D}" fill="none" stroke="url(#${id})" stroke-width="${w||3}" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  }
  const OPTS = [
    ["Amber Gold", [["0","#e8a84a"],["1","#d8b07a"]], "#e8a84a → #d8b07a"],
    ["Amber Red",  [["0","#e0a458"],["1","#e0584a"]], "#e0a458 → #e0584a"],
    ["Burnt Orange",[["0","#e0813a"],["1","#b8501a"]], "#e0813a → #b8501a"],
  ];
  document.getElementById("row").innerHTML = OPTS.map(([n,st,hex]) => `
    <div class="card">
      <div class="name">${n}</div>
      <div class="big">${sv(st)}</div>
      <div class="sizes"><span class="t32">${sv(st)}</span><span class="t16">${sv(st,3.4)}</span></div>
      <div class="tabrow">
        <span class="tab d">${sv(st,3.4)}<span>Yap Code</span></span>
        <span class="tab l">${sv(st,3.4)}<span>Yap Code</span></span>
      </div>
      <div class="hex">${hex}</div>
    </div>`).join("");
</script>
</body>
</html>
